<body class="internal-page">

    <!-- CONTENEDOR PRINCIPAL QUE EMPUJA EL FOOTER -->

        <header>
            <a href="index.html">

                    <li><a href="nosotros.html">NOSOTROS</a></li>
                </ul>
            </nav>
        </header>

        <main id="noticia-detalle" class="noticia-detalle">
            <!-- El contenido se carga dinámicamente -->
        </main>

        <!-- COMPARTIR NOTICIA -->
        <section class="share-news">
            <span class="share-news-title">Comparte esta noticia con más fans</span>

            <div class="share-news-buttons">

    <button id="nativeShareButton" class="share-icon" type="button">
        <i class="fa-solid fa-share-nodes"></i>
    </button>

    <a id="shareWhatsapp" class="share-icon" href="#">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <a id="shareFacebook" class="share-icon" href="#">
        <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a id="shareX" class="share-icon" href="#">
        <i class="fa-brands fa-x-twitter"></i>
    </a>

    <a id="shareTelegram" class="share-icon" href="#">
        <i class="fa-brands fa-telegram"></i>
    </a>

    <button id="copyNewsLink" class="share-icon" type="button">
        <i class="fa-regular fa-copy"></i>
    </button>

</div>

            <span
                id="copyLinkMessage"
                class="copy-link-message"
                aria-live="polite"
            ></span>
        </section>

    </div>

    <footer class="footer">
        <div class="footer-container">

            <div class="footer-col">
                <img
                    src="images/logofooter.png"
                    alt="TOKIO PANIC"
                    class="footer-logo"
                >
            </div>

            <div class="footer-col">
                <h4 class="footer-title">NUESTRAS REDES SOCIALES:</h4>

                <div class="footer-social">

                        href="https://www.tiktok.com/@tokiopanic"

                            src="images/tiktok.png"
                            alt="TikTok"
                            class="social-icon-footer"
                        >
                    </a>

                    <a
                        href="https://www.instagram.com/tokiopanic"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-icon-link"

                            src="images/insta.png"
                            alt="Instagram"
                            class="social-icon-footer"
                        >
                    </a>

                    <a
                        href="https://www.youtube.com/@tokio-panic"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="social-icon-link"
                    >
                        <img
                            src="images/yt.png"
                            alt="YouTube"
                            class="social-icon-footer"
                        >

            </div>

            <div class="footer-col">

                <a
                    href="mailto:contacto@tokiopanic.com"

                >
                    contacto@tokiopanic.com
                </a>
            </div>

        </div>
    </footer>

    <script src="script.js"></script>
    <script src="noticias-loader.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const shareWhatsapp = document.getElementById("shareWhatsapp");
            const shareFacebook = document.getElementById("shareFacebook");
            const shareX = document.getElementById("shareX");
            const shareTelegram = document.getElementById("shareTelegram");
            const nativeShareButton = document.getElementById("nativeShareButton");
            const copyNewsLink = document.getElementById("copyNewsLink");
            const copyLinkMessage = document.getElementById("copyLinkMessage");

            function getNewsTitle() {
                const titleElement =
                    document.querySelector(".noticia-titulo") ||
                    document.querySelector(".noticia-title") ||
                    document.querySelector(".article-title") ||
                    document.querySelector("#noticia-detalle h1");

                return titleElement
                    ? titleElement.textContent.trim()
                    : document.title;
            }

            function configureShareButtons() {
                const currentUrl = window.location.href;
                const newsTitle = getNewsTitle();

                const encodedUrl = encodeURIComponent(currentUrl);
                const encodedTitle = encodeURIComponent(
                    `${newsTitle} | TOKIO PANIC`
                );

                shareWhatsapp.href =
                    `https://wa.me/?text=${encodedTitle}%20${encodedUrl}`;

                shareFacebook.href =
                    `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;

                shareX.href =
                    `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`;

                shareTelegram.href =
                    `https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`;
            }

            copyNewsLink.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(window.location.href);

                    copyNewsLink.textContent = "Enlace copiado";
                    copyLinkMessage.textContent =
                        "El enlace de la noticia se copió correctamente.";

                    setTimeout(() => {
                        copyNewsLink.textContent = "Copiar enlace";
                        copyLinkMessage.textContent = "";
                    }, 2500);
                } catch (error) {
                    copyLinkMessage.textContent =
                        "No fue posible copiar el enlace.";
                    console.error(error);
                }
            });

            if (navigator.share) {
                nativeShareButton.addEventListener("click", async () => {
                    try {
                        await navigator.share({
                            title: getNewsTitle(),
                            text: `${getNewsTitle()} | TOKIO PANIC`,
                            url: window.location.href
                        });
                    } catch (error) {
                        if (error.name !== "AbortError") {
                            console.error(error);
                        }
                    }
                });
            } else {
                nativeShareButton.style.display = "none";
            }

            /*
             * noticias-loader.js carga la noticia dinámicamente.
             * Este observador espera hasta que aparezca el contenido.
             */
            const noticiaDetalle =
                document.getElementById("noticia-detalle");

            const observer = new MutationObserver(() => {
                if (noticiaDetalle.querySelector("h1")) {
                    configureShareButtons();
                    observer.disconnect();
                }
            });

            observer.observe(noticiaDetalle, {
                childList: true,
                subtree: true
            });

            configureShareButtons();
        });
    </script>

</body>
</html>
